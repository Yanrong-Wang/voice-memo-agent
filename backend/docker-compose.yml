services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: voice_memo
      POSTGRES_USER: voice_memo
      POSTGRES_PASSWORD: voice_memo
    ports:
      - "5432:5432"
    volumes:
      - voice-memo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_memo -d voice_memo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - voice-memo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_CONNECTION_STRING: postgresql+psycopg://voice_memo:voice_memo@postgres:5432/voice_memo
    command:
      - rq
      - worker
      - --url
      - redis://redis:6379/0
      - voice-memo-analysis
    volumes:
      - ./data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  voice-memo-postgres:
  voice-memo-redis:
